services:
  db:
    image: postgres:15-alpine
    container_name: iv_telematics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: iv_telematics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iv_telematics"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: iv_telematics_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/iv_telematics
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
