; =====================================================================================
; PlatformIO Project Configuration
; Smart IoT IV Fluid Infusion Monitoring and Drip-Rate Telematics System
; Amal Jyothi College of Engineering - MCA 24MCAT213 (Internet of Things)
; =====================================================================================

[platformio]
default_envs = esp32doit-devkit-v1
src_dir = src
include_dir = include

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Serial Monitor configuration
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; High speed firmware upload
upload_speed = 921600

; Library Dependencies automatically installed by PlatformIO
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

; Compilation flags
build_flags =
    -D CORE_DEBUG_LEVEL=3
